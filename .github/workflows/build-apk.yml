name: Build APK

# Manual release build: bundles the Linux runtime, then builds the APK.
# The stock ci.yml only runs tests and never produces an installable APK.
#
# Deliberately does NOT use tooling/setup-toolchain.sh: that script pulls JDK and
# Flutter from China mirrors (tuna / storage.flutter-io.cn), which are slow and
# flaky from a US runner. The actions below fetch the same versions from their
# primary sources, and Gradle resolves the NDK itself from the runner's SDK.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Target ABI"
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  # 内置代理's kernel (mihomo, GPL-3.0): bundled as libmihomo.so in jniLibs.
  MIHOMO_VERSION: v1.19.34
  TZ: Asia/Shanghai
  UV_USE_IO_URING: 0
  # The runner reaches Maven Central and Google directly; the Aliyun mirrors
  # answer 502 from there and Gradle then gives up on every artifact.
  DSH_MAVEN_MIRRORS: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The release key comes from repository secrets, so every build of this
      # package upgrades in place instead of needing an uninstall.
      - name: Write the release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "no release key configured; the build will use the debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/android/release.keystore
          cat > app/android/key.properties <<PROPS
          storeFile=../release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
          flutter doctor -v | sed -n '1,40p'

      # build-apk.sh compiles libtawcroot.so (the opt-in launch method) with this
      # exact NDK and refuses a release build without it.
      - name: Install NDK 28.2.13676358
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "sdk root: $SDK_ROOT"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then
            echo "no sdkmanager under $SDK_ROOT"; ls "$SDK_ROOT" || true; exit 1
          fi
          echo "sdkmanager: $SDKM"
          # sdkmanager closes stdin once it has what it needs; `yes` then dies with
          # SIGPIPE, so the pipe's status is not the install's. Verify the directory.
          yes | "$SDKM" --install "ndk;28.2.13676358" > /dev/null 2>&1 || true
          test -d "$SDK_ROOT/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install runtime build prerequisites
        run: sudo apt-get update -q && sudo apt-get install -y -q xz-utils zstd

      # The streaming recognizer's model (Apache-2.0, ~198 MB) normally downloads on
      # first use. Bundling it into the APK means a fresh install can speak without
      # waiting, at the cost of APK size.
      - name: Bundle the speech model
        run: |
          set -euo pipefail
          dest="app/android/app/src/main/assets/asr"
          mkdir -p "$dest"
          base="https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/resolve/98590b7ed6443e77b714204da2757d75e1a642f4"
          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.int8.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            echo "fetching $f"
            curl -fL --retry 3 --retry-delay 5 -o "$dest/$f" "$base/$f"
          done
          ls -lh "$dest"

      # 内置代理: mihomo as jniLibs/libmihomo.so — the one place Android lets an app
      # execute from (extractNativeLibs=true, useLegacyPackaging=true).
      - name: Bundle the proxy kernel
        run: |
          set -euo pipefail
          abi="${{ github.event.inputs.abi || 'arm64' }}"
          case "$abi" in
            arm64) asset="mihomo-android-arm64-v8"; dir="arm64-v8a" ;;
            x64)   asset="mihomo-android-amd64";    dir="x86_64" ;;
            *) echo "unsupported abi: $abi" >&2; exit 1 ;;
          esac
          mkdir -p "app/android/app/src/main/jniLibs/$dir"
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${asset}-${MIHOMO_VERSION}.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/mihomo.gz "$url"
          gunzip -f /tmp/mihomo.gz
          install -m 755 /tmp/mihomo "app/android/app/src/main/jniLibs/$dir/libmihomo.so"
          ls -lh "app/android/app/src/main/jniLibs/$dir/libmihomo.so"

      - name: Build bundled Linux runtime
        run: |
          set -euo pipefail
          abi="${{ github.event.inputs.abi || 'arm64' }}"
          case "$abi" in
            arm64) target=arm64-v8a ;;
            x64) target=x86_64 ;;
            *) echo "unsupported abi: $abi" >&2; exit 1 ;;
          esac
          bash runtime/build-runtime.sh "$target"

      - name: Build APK
        run: |
          set -euo pipefail
          abi="${{ github.event.inputs.abi || 'arm64' }}"
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f "$abi"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-${{ github.event.inputs.abi || 'arm64' }}-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
